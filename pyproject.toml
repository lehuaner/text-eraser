[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# PyPI 发行名 text-eraser 与 import 包名 text_eraser 对应 (PyPI 对 -/_ 归一化为同名);
# 0.1.x 期间的曾用导入名 textpatch 已于 0.2.0 弃用。
# cv2 (OpenCV) 不进依赖: 由使用方环境提供 opencv-python 或 opencv-python-headless
# (二者严禁同环境混装, OpenCV 官方禁止), 仅 DBNet 检测链需要。
# wasmtime 是 0.3.0 起的硬依赖: 算法核心 = 打包随发的 textcore.wasm 共享核。
name = "text-eraser"
version = "0.3.0"
description = "图片文字擦除工具：DBNet 文字检测 + PatchMatch 内容识别填充 + 去发光（wasm 共享算法核，前后端逐字节一致），附本地 Web 界面"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "lehuaner" }]
requires-python = ">=3.10"
keywords = ["text-removal", "inpainting", "patchmatch", "dbnet", "ocr", "image-processing", "wasm", "text-eraser"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Editors",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
    "wasmtime>=25.0",
]

[project.optional-dependencies]
# Web 界面 (text-eraser / python -m text_eraser)
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
# DBNet 文字检测 (ONNX 推理)
ml = ["onnxruntime>=1.16"]
dev = ["pytest>=8.0", "build>=1.0", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/lehuaner/text-eraser"
Repository = "https://github.com/lehuaner/text-eraser"
Issues = "https://github.com/lehuaner/text-eraser/issues"

[project.scripts]
text-eraser = "text_eraser.webapp:main"

[tool.setuptools.packages.find]
include = ["text_eraser*"]
exclude = ["deglow*", "scripts*", "tests*"]

[tool.setuptools.package-data]
text_eraser = ["static/**/*", "assets/*", "assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
